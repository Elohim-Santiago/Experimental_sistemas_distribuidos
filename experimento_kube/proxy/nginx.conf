user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# Balanceamento de carga TCP/gRPC para o cluster etcd
stream {
    upstream etcd_cluster {
        server etcd1:2379 max_fails=3 fail_timeout=10s;
        server etcd2:2379 max_fails=3 fail_timeout=10s;
        server etcd3:2379 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 2379;
        proxy_pass etcd_cluster;
        proxy_connect_timeout 2s;
        proxy_timeout 1h;
    }
}