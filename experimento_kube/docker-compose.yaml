version: '3.8'

services: 
  etcd1: 
    image: quay.io/coreos/etcd:v3.5.10
    container_name: etcd1
    networks:
      - etcd-net
    command: 
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/data.etcd
      - --advertise-client-urls=http://etcd1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-1 
    volumes: 
      - etcd1-data:/data.etcd
    logging: 
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "5"
    restart: always

  etcd2: 
    image: quay.io/coreos/etcd:v3.5.10
    container_name: etcd2
    networks: 
      - etcd-net
    command: 
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/data.etcd
      - --advertise-client-urls=http://etcd2:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-1 
    volumes: 
      - etcd2-data:/data.etcd
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "5"
    restart: always
  
  etcd3: 
    image: quay.io/coreos/etcd:v3.5.10
    container_name: etcd3
    networks: 
      - etcd-net
    command: 
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/data.etcd
      - --advertise-client-urls=http://etcd3:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-1 
    volumes: 
      - etcd3-data:/data.etcd
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "5"
    restart: always

  nginx: 
    image: nginx:alpine
    container_name: nginx-etcd
    volumes: 
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: 
      - etcd-net
    ports: 
      - "2379:2379"
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    logging:
      driver: "json-file"
      options: 
        max-size: "1m"
        max-file: "5"
    restart: always

networks: 
  etcd-net:
    driver: bridge 

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data: